name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    name: Contract lint and direct tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
          cache: npm
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run test:direct

  frontend:
    name: Frontend checks
    runs-on: windows-2025
    env:
      # Ephemeral address proven by the local deployment/readback harness; CI never publishes this build.
      NEXT_PUBLIC_GENLAYER_NETWORK: localnet
      NEXT_PUBLIC_ACCESSSEAL_CONTRACT_ADDRESS: 0x7216c4492b0266a630265f92c9489e9511086e4a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
          cache: npm
      - run: npm ci
      - name: Install frontend dependencies when present
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then npm --prefix frontend ci; else echo "No frontend/package.json yet; skipping frontend install."; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  integration:
    name: Integration tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
          cache: npm
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: npm ci
      - run: npm run test:integration
