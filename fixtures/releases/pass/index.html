<!doctype html>
<html lang="en">
  <head><title>Accessible checkout</title></head>
  <body>
    <main>
      <h1>Checkout</h1>
      <img src="shoe.jpg" alt="Blue running shoe with white sole">
      <form>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required>
        <button type="submit">Place order</button>
      </form>
      <p role="status" aria-live="polite">Ready to submit</p>
    </main>
  </body>
</html>
