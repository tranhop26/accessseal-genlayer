[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "accessseal"
version = "0.1.0"
description = "Evidence-bound accessibility release acceptance on GenLayer"
requires-python = ">=3.12"
dependencies = [
  "genlayer-test[sim]==0.29.2",
  "genvm-linter==0.11.0",
  "python-minifier==3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
